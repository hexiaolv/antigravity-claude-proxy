<div x-data="logsViewer" style="height: 100%; display: flex; flex-direction: column;">
    <div class="m3-card" style="padding: 0; display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden;">
        <!-- Toolbar -->
        <div style="background: var(--bg-surface); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border-subtle); gap: 12px;">
            <!-- Left: Title -->
            <div class="flex-row items-center gap-2">
                <span class="material-symbols-outlined" style="color: var(--md-sys-color-primary); font-size: 20px;">terminal</span>
                <span class="font-mono text-sm font-semibold">Console Logs</span>
            </div>

            <!-- Center: Search & Filters -->
            <div class="m3-search-box">
                <md-outlined-text-field 
                    :value="searchQuery" 
                    @input="searchQuery = $event.target.value" 
                    :placeholder="$store.global.t('grepLogs')">
                    <span class="material-symbols-outlined" slot="leading-icon" style="font-size: 20px;">search</span>
                </md-outlined-text-field>
            </div>

            <!-- Log Level Filter Chips -->
            <div class="flex-row items-center gap-1" style="font-size: 0.8rem;">
                <md-filter-chip label="INFO" :selected="filters.INFO" @click="filters.INFO = !filters.INFO"></md-filter-chip>
                <md-filter-chip label="SUCCESS" :selected="filters.SUCCESS" @click="filters.SUCCESS = !filters.SUCCESS"></md-filter-chip>
                <md-filter-chip label="WARN" :selected="filters.WARN" @click="filters.WARN = !filters.WARN"></md-filter-chip>
                <md-filter-chip label="ERR" :selected="filters.ERROR" @click="filters.ERROR = !filters.ERROR"></md-filter-chip>
            </div>

            <!-- Right: Controls -->
            <div class="flex-row items-center gap-3">
                <span class="font-mono text-xs" style="color: var(--text-secondary);">
                    <span x-text="filteredLogs.length"></span>/<span x-text="logs.length"></span>
                </span>
                <div class="flex-row items-center gap-1">
                    <span class="font-mono text-xs" style="color: var(--text-secondary);" x-text="$store.global.t('autoScroll')">Auto-Scroll</span>
                    <md-switch :selected="isAutoScroll" @change="isAutoScroll = $event.target.selected"></md-switch>
                </div>
                <md-icon-button @click="exportLogs" :title="$store.global.t('exportLogs')" x-show="$store.data.devMode && $store.settings.logExport">
                    <span class="material-symbols-outlined">download</span>
                </md-icon-button>
                <md-icon-button @click="clearLogs" :title="$store.global.t('clearLogs')">
                    <span class="material-symbols-outlined">delete</span>
                </md-icon-button>
            </div>
        </div>

        <!-- Log Content -->
        <div id="logs-container" style="flex: 1; overflow-y: auto; padding: 12px 16px; font-family: monospace; font-size: 12px; line-height: 1.6; background: var(--bg-page);">
            <template x-for="log in filteredLogs" :key="log._id || log.timestamp">
                <div class="flex-row items-center gap-3" style="padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.03);">
                    <!-- Timestamp -->
                    <span style="color: var(--text-secondary); width: 70px; flex-shrink: 0;"
                        x-text="new Date(log.timestamp).toLocaleTimeString([], {hour12:false})"></span>

                    <!-- Level Badge -->
                    <span style="padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; width: 60px; text-align: center; flex-shrink: 0;"
                        :style="{
                            background: log.level === 'ERROR' ? 'var(--md-sys-color-error-container)' : 
                                       (log.level === 'WARN' ? '#fef08a' : 
                                       (log.level === 'SUCCESS' ? '#bbf7d0' : 'var(--md-sys-color-secondary-container)')),
                            color: log.level === 'ERROR' ? 'var(--md-sys-color-on-error-container)' : 
                                   (log.level === 'WARN' ? '#713f12' : 
                                   (log.level === 'SUCCESS' ? '#14532d' : 'var(--md-sys-color-on-secondary-container)'))
                        }" x-text="log.level"></span>

                    <!-- Message -->
                    <span style="color: var(--text-primary); word-break: break-all; flex: 1;"
                        x-html="Redact.logMessage(log.message).replace(/\n/g, '<br>')"></span>
                </div>
            </template>
            <div x-show="filteredLogs.length === 0 && logs.length > 0" style="text-align: center; margin-top: 2rem; color: var(--text-secondary);"
                x-text="$store.global.t('noLogsMatch')">
                No logs match filter
            </div>
        </div>
    </div>
</div>
