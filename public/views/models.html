<div x-data="models" class="flex-col gap-6" style="display: flex;">
    <!-- Compact Header -->
    <div class="flex-row items-center justify-between gap-4" style="flex-wrap: wrap;">
        <!-- Title -->
        <div class="flex-row items-center gap-3">
            <h1 style="font-size: 1.5rem; font-weight: 700; color: var(--text-primary);" x-text="$store.global.t('models')">
                Models
            </h1>
            <div style="padding: 2px 10px; border-radius: 12px; background: var(--md-sys-color-surface-container-high); border: 1px solid var(--border-subtle);">
                <span class="font-mono text-xs" style="color: var(--text-secondary);" x-text="$store.global.t('modelsPageDesc')">
                    Real-time quota and status for all available models.
                </span>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="m3-search-box">
            <md-outlined-text-field 
                :value="$store.data.filters.search" 
                @input="$store.data.filters.search = $event.target.value; $store.data.computeQuotaRows()" 
                :placeholder="$store.global.t('searchPlaceholder')">
                <span class="material-symbols-outlined" slot="leading-icon" style="font-size: 20px;">search</span>
            </md-outlined-text-field>
        </div>
    </div>

    <!-- Section 1: 各账号独立配额明细 (Per-Account Quota Breakdown) -->
    <div class="m3-card" x-show="$store.data.accountCategoryCards.length > 0">
        <div class="m3-card-header flex-row items-center justify-between" style="margin-bottom: 0.75rem;">
            <div class="flex-row items-center gap-2">
                <span class="material-symbols-outlined" style="color: var(--md-sys-color-tertiary);">badge</span>
                <span class="m3-card-title" style="margin-bottom: 0;" x-text="$store.global.t('accountQuotaBreakdown')">各账号独立配额概览</span>
            </div>
            <span class="font-mono text-xs" style="color: var(--text-secondary);" x-text="$store.global.t('totalAccountsCount', { count: $store.data.accountCategoryCards.length })"></span>
        </div>

        <div class="flex-col gap-3">
            <template x-for="accCard in $store.data.accountCategoryCards" :key="accCard.email">
                <div style="padding: 12px 16px; background: var(--bg-surface); border-radius: 12px; border: 1px solid var(--border-subtle);">
                    <!-- Header of Account -->
                    <div class="flex-row items-center justify-between gap-3" style="flex-wrap: wrap; margin-bottom: 10px;">
                        <div class="flex-row items-center gap-2">
                            <span class="material-symbols-outlined" style="font-size: 20px; color: var(--text-secondary);">account_circle</span>
                            <span class="font-mono text-sm font-bold" x-text="accCard.displayEmail"></span>
                            <span class="m3-status-pill" :style="{ background: accCard.tier === 'ultra' ? 'rgba(234, 179, 8, 0.15)' : 'var(--md-sys-color-secondary-container)' }" x-text="(accCard.tier || 'free').toUpperCase()"></span>
                            <span class="text-xs font-mono" :style="{ color: accCard.enabled ? '#22c55e' : 'var(--text-secondary)' }" x-text="accCard.enabled ? 'ACTIVE' : 'DISABLED'"></span>
                        </div>
                        <div class="flex-row items-center gap-2">
                            <md-text-button @click="$store.data.filters.account = accCard.email; $store.data.computeQuotaRows();">
                                <span class="material-symbols-outlined" slot="icon">filter_alt</span>
                                <span x-text="$store.global.t('filterThisAccount')">只看此账号</span>
                            </md-text-button>
                        </div>
                    </div>

                    <!-- Dual Categories for Account -->
                    <div class="m3-grid-2col" style="margin-bottom: 0; gap: 0.75rem;">
                        <!-- Gemini -->
                        <div style="padding: 8px 12px; background: var(--bg-card); border-radius: 8px; border: 1px solid var(--border-subtle);">
                            <div class="flex-row items-center justify-between text-xs" style="margin-bottom: 6px;">
                                <span class="font-semibold">Gemini Models</span>
                                <span class="font-mono font-bold" x-text="'5H: ' + accCard.gemini.fiveHour.pct + '% · W: ' + accCard.gemini.weekly.pct + '%'"></span>
                            </div>
                            <md-linear-progress :value="accCard.gemini.fiveHour.pct / 100"></md-linear-progress>
                            <div class="flex-row items-center justify-between text-xs font-mono" style="color: var(--text-secondary); margin-top: 6px;">
                                <span x-text="accCard.gemini.fiveHour.resetTime ? $store.global.t('resetPrefix') + window.utils.formatTimeUntil(accCard.gemini.fiveHour.resetTime) : $store.global.t('ready5H')"></span>
                                <span x-text="accCard.gemini.weekly.resetTime ? $store.global.t('weeklyPrefix') + window.utils.formatTimeUntil(accCard.gemini.weekly.resetTime) : ''"></span>
                            </div>
                        </div>

                        <!-- Claude -->
                        <div style="padding: 8px 12px; background: var(--bg-card); border-radius: 8px; border: 1px solid var(--border-subtle);">
                            <div class="flex-row items-center justify-between text-xs" style="margin-bottom: 6px;">
                                <span class="font-semibold">Claude & GPT Models</span>
                                <span class="font-mono font-bold" x-text="'5H: ' + accCard.claude.fiveHour.pct + '% · W: ' + accCard.claude.weekly.pct + '%'"></span>
                            </div>
                            <md-linear-progress :value="accCard.claude.fiveHour.pct / 100"></md-linear-progress>
                            <div class="flex-row items-center justify-between text-xs font-mono" style="color: var(--text-secondary); margin-top: 6px;">
                                <span x-text="accCard.claude.fiveHour.resetTime ? $store.global.t('resetPrefix') + window.utils.formatTimeUntil(accCard.claude.fiveHour.resetTime) : $store.global.t('ready5H')"></span>
                                <span x-text="accCard.claude.weekly.resetTime ? $store.global.t('weeklyPrefix') + window.utils.formatTimeUntil(accCard.claude.weekly.resetTime) : ''"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- Section 2: 逐模型详细列表与账号分配明细 (Detailed Models Table) -->
    <div class="m3-card" style="padding: 0; overflow: hidden;">
        <!-- Header Toggle Bar -->
        <div class="flex-row items-center justify-between" 
             style="padding: 12px 16px; background: var(--bg-surface); cursor: pointer; user-select: none;"
             :style="showTable ? 'border-bottom: 1px solid var(--border-subtle);' : ''"
             @click="showTable = !showTable">
            <div class="flex-row items-center gap-2">
                <span class="material-symbols-outlined" style="color: var(--md-sys-color-primary);">table_chart</span>
                <span class="m3-card-title" style="margin-bottom: 0;" x-text="$store.global.t('detailTableView')">模型明细表</span>
                <span class="m3-status-pill" style="font-size: 11px; padding: 2px 8px;" x-text="$store.global.t('showingModels', { count: $store.data.quotaRows.length })"></span>
            </div>
            <md-outlined-button @click.stop="showTable = !showTable">
                <span class="material-symbols-outlined" slot="icon" x-text="showTable ? 'expand_less' : 'expand_more'"></span>
                <span x-text="showTable ? $store.global.t('hideModelsTable') : $store.global.t('showModelsTable')"></span>
            </md-outlined-button>
        </div>

        <!-- Collapsible Content -->
        <div x-show="showTable">
            <!-- Controls Toolbar -->
            <div style="background: var(--bg-surface); border-bottom: 1px solid var(--border-subtle); padding: 12px 16px;" class="flex-row items-center justify-between gap-4">
                <div class="flex-row items-center gap-3 flex-wrap">
                    <!-- Account Filter Select -->
                    <div style="min-width: 180px;">
                        <select style="width: 100%; height: 40px; padding: 0 36px 0 12px; font-size: 0.85rem;"
                            x-model="$store.data.filters.account" @change="$store.data.computeQuotaRows()">
                            <option value="all" x-text="$store.global.t('allAccounts')">All Accounts</option>
                            <template x-for="acc in $store.data.accounts" :key="acc.email">
                                <option :value="acc.email" x-text="Redact.email(acc.email).split('@')[0]"></option>
                            </template>
                        </select>
                    </div>

                <!-- Family Filter Chips -->
                <div class="flex-row items-center gap-1">
                    <md-filter-chip class="m3-chip-radio" label="ALL" :selected="$store.data.filters.family === 'all'" @click="$store.data.filters.family = 'all'; $store.data.computeQuotaRows()"></md-filter-chip>
                    <md-filter-chip class="m3-chip-radio" label="CLAUDE" :selected="$store.data.filters.family === 'claude'" @click="$store.data.filters.family = 'claude'; $store.data.computeQuotaRows()"></md-filter-chip>
                    <md-filter-chip class="m3-chip-radio" label="GEMINI" :selected="$store.data.filters.family === 'gemini'" @click="$store.data.filters.family = 'gemini'; $store.data.computeQuotaRows()"></md-filter-chip>
                </div>

                <!-- Show Hidden Switch -->
                <div class="flex-row items-center gap-2" style="margin-left: 8px;">
                    <span class="text-xs font-mono" style="color: var(--text-secondary);" x-text="$store.settings.showHiddenModels ? $store.global.t('hiddenOn') : $store.global.t('hiddenOff')"></span>
                    <md-switch :selected="$store.settings.showHiddenModels" @change="$store.settings.toggle('showHiddenModels'); $store.data.computeQuotaRows()"></md-switch>
                </div>
            </div>

            <!-- Total count label -->
            <div class="font-mono text-xs" style="color: var(--text-secondary);" x-text="$store.global.t('showingModels', { count: $store.data.quotaRows.length })">
            </div>
        </div>

        <div class="m3-table-container">
            <table class="m3-table">
                <thead>
                    <tr>
                        <th style="width: 50px;" x-text="$store.global.t('stat')">Stat</th>
                        <th style="min-width: 180px;" x-text="$store.global.t('modelIdentity')">Model Identity</th>
                        <th style="min-width: 420px;" x-text="$store.global.t('accountQuotasAndReset')">各账号配额与刷新明细 (Account Quotas & Reset)</th>
                        <th style="width: 90px; text-align: right;" x-text="$store.global.t('actions')">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="row in $store.data.quotaRows" :key="row.modelId">
                        <tr :style="row.hidden ? 'opacity: 0.5;' : ''">
                            <!-- Status dot -->
                            <td style="vertical-align: top; padding-top: 14px;">
                                <span class="m3-status-dot" :class="row.avgQuota > 0 ? 'connected' : 'disconnected'"></span>
                            </td>

                            <!-- Model Identity -->
                            <td style="vertical-align: top; padding-top: 14px;">
                                <div class="flex-col gap-1">
                                    <span class="font-bold text-sm" x-text="row.modelId"></span>
                                    <div class="flex-row items-center gap-2">
                                        <span class="text-xs font-mono" style="color: var(--text-secondary);" x-text="row.family"></span>
                                        <span class="m3-status-pill" style="font-size: 10px; padding: 1px 6px;" x-text="$store.global.t('averageColon', { pct: row.avgQuota })"></span>
                                    </div>
                                </div>
                            </td>

                            <!-- 各账号配额与重置时间合并列 (Account Quotas & Reset) -->
                            <td style="vertical-align: middle;">
                                <div class="flex-col gap-2" style="max-width: 640px;">
                                    <template x-for="q in getVisibleAccounts(row)" :key="q.fullEmail">
                                        <div class="flex-row items-center text-xs font-mono" style="padding: 6px 12px; background: var(--bg-surface); border-radius: 8px; border: 1px solid var(--border-subtle); gap: 10px; flex-wrap: nowrap;">
                                            <!-- Account name (固定宽与截断保护，杜绝重叠) -->
                                            <div class="flex-row items-center gap-1.5" style="width: 125px; min-width: 125px; flex-shrink: 0; overflow: hidden;">
                                                <span class="material-symbols-outlined" style="font-size: 15px; color: var(--text-secondary); flex-shrink: 0;">person</span>
                                                <span class="truncate font-semibold" style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" x-text="q.email" :title="q.fullEmail"></span>
                                            </div>

                                            <!-- Quota bar (弹性填充，各行两端绝对对齐) -->
                                            <div style="flex: 1; min-width: 80px; display: flex; align-items: center;">
                                                <md-linear-progress style="width: 100%;" :value="q.pct / 100"></md-linear-progress>
                                            </div>

                                            <!-- Quota percentage (固定 42px 等宽数字右对齐) -->
                                            <span style="width: 42px; min-width: 42px; flex-shrink: 0; font-weight: bold; text-align: right; font-variant-numeric: tabular-nums;"
                                                  :style="{ color: q.pct > 50 ? '#22c55e' : (q.pct > 0 ? '#eab308' : 'var(--md-sys-color-error)') }" 
                                                  x-text="q.pct + '%'"></span>

                                            <!-- Reset time badges (固定容器保证进度条长度完全一致，white-space 防止折行) -->
                                            <div class="flex-row items-center gap-1.5" style="width: 196px; min-width: 196px; flex-shrink: 0;">
                                                <!-- 5H Reset (固定 92px，单行防折行) -->
                                                <div class="flex-row items-center justify-center gap-1" style="width: 92px; padding: 2px 4px; border-radius: 4px; background: var(--bg-card); border: 1px solid var(--border-subtle); box-sizing: border-box; white-space: nowrap;" :title="q.resetTime ? window.utils.formatDateTime(q.resetTime) : ''">
                                                    <span style="color: var(--text-secondary); font-size: 10px; font-weight: 600;" x-text="$store.global.t('fiveHourColon')">5H:</span>
                                                    <span style="font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap;" :style="{ color: q.resetTime ? 'var(--md-sys-color-primary)' : 'var(--text-secondary)' }" x-text="window.utils.formatTimeUntil(q.resetTime)"></span>
                                                </div>

                                                <!-- Weekly Reset (固定 98px，单行防折行) -->
                                                <div x-show="q.weeklyResetTime" class="flex-row items-center justify-center gap-1" style="width: 98px; padding: 2px 4px; border-radius: 4px; background: var(--bg-card); border: 1px solid var(--border-subtle); box-sizing: border-box; white-space: nowrap;" :title="q.weeklyResetTime ? window.utils.formatDateTime(q.weeklyResetTime) : ''">
                                                    <span style="color: var(--text-secondary); font-size: 10px; font-weight: 600;" x-text="$store.global.t('weekColon')">周:</span>
                                                    <span style="font-weight: 600; color: var(--md-sys-color-tertiary); font-variant-numeric: tabular-nums; white-space: nowrap;" x-text="window.utils.formatTimeUntil(q.weeklyResetTime)"></span>
                                                </div>
                                            </div>
                                        </div>
                                    </template>

                                    <!-- Expand / Collapse -->
                                    <div x-show="getHiddenCount(row) > 0" class="text-xs font-mono" style="color: var(--md-sys-color-primary); cursor: pointer; padding-left: 4px;" @click="toggleExpanded(row.modelId)">
                                        <span x-text="'+ ' + getHiddenCount(row) + ' ' + ($store.global.t('moreAccounts') || 'more accounts...')"></span>
                                    </div>
                                </div>
                            </td>

                            <!-- Actions -->
                            <td style="text-align: right; vertical-align: top; padding-top: 10px;">
                                <div class="flex-row items-center justify-end gap-1">
                                    <!-- Pin -->
                                    <md-icon-button @click="await updateModelConfig(row.modelId, { pinned: !row.pinned })" :title="row.pinned ? $store.global.t('unpinModel') : $store.global.t('pinModel')">
                                        <span class="material-symbols-outlined" :style="row.pinned ? 'color: var(--md-sys-color-primary);' : 'color: var(--text-secondary);'">
                                            push_pin
                                        </span>
                                    </md-icon-button>
                                    <!-- Hide -->
                                    <md-icon-button @click="await updateModelConfig(row.modelId, { hidden: !row.hidden })" :title="row.hidden ? $store.global.t('unhideModel') : $store.global.t('hideModel')">
                                        <span class="material-symbols-outlined" :style="row.hidden ? 'color: var(--md-sys-color-error);' : 'color: var(--text-secondary);'">
                                            visibility
                                        </span>
                                    </md-icon-button>
                                </div>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
        </div>
    </div>
</div>
